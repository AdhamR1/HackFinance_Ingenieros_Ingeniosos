# Configuración del data lake de viabilidad de data centers (rejilla 3,5 x 3,5 km; España, Japón y EEUU)
# Las rutas relativas se resuelven desde la carpeta de este archivo.

project:
  country_iso3: ESP                 # país por defecto; otro con --country JPN o DCLAKE_COUNTRY (ver country_profiles)
  crs_equal_area: "EPSG:3035"       # lo fija el perfil de cada país (proyección de igual área, en metros)
  cell_size_m: 3500                 # celdas de 3,5 x 3,5 km = 12,25 km²
  min_land_fraction: 0.5            # una celda entra si al menos la mitad es tierra
  max_cells_per_part: 25000         # los países grandes se procesan por franjas para no agotar la memoria
  seed: 42
  pipeline_version: "0.1.0"

period:                             # últimos 20 años completos de datos diarios
  start: "2006-11-01"
  end: "2026-10-31"

sampling:
  # "all" = las ~20.200 celdas de España (sample_type marca positivo_dc / foco_region / resto).
  # Un número (p. ej. 500) = muestra estratificada. Se puede cambiar en .env con DCLAKE_N_CELLS.
  n_cells: all
  n_positive_max: 100               # celdas con data center conocido (OSM + PeeringDB)
  focus_regions: ["madrid", "aragon"]   # (por país en country_profiles) sin tildes contra ADM1; "=x" exige el nombre exacto
  n_focus: 150                      # celdas extra en las regiones de la demo
  # el resto, aleatorias en toda España

paths:
  dataset_dir: "dataset"            # el dataset final (tablas Parquet del diccionario)
  lake_dir: ".cache"                # descargas e intermedios para reanudar (no se versiona)
  dictionary: "data_dictionary/diccionario_datos_datacenters.xlsx"

countries: [ESP, USA, MYS, IND, AUS, CHN, JPN, GBR]   # tabla country_context

# Cajas del país [oeste, sur, este, norte]: las fija el perfil de cada país (abajo)
bboxes:
  peninsula_baleares: [-9.6, 35.8, 4.6, 43.9]
  canarias: [-18.3, 27.5, -13.3, 29.5]

# Un perfil por país con rejilla; se elige con --country o DCLAKE_COUNTRY. Cada país tiene su caché
# (.cache/ISO) y sus archivos en el dataset (dataset/<tabla>/ISO-pNN.parquet).
# Sus claves sustituyen a las de project, bboxes y sampling.focus_regions.
country_profiles:
  ESP:
    name: Spain                      # nombre en los archivos de NASA FIRMS y TeleGeography
    iso2: ES
    crs_equal_area: "EPSG:3035"      # ETRS89-LAEA Europa
    climate: eobs                    # E-OBS 0,1° (observaciones, solo Europa)
    neighbours_iso2: [ES, PT, FR, AD, GI, MA]   # aeropuertos y PeeringDB también al otro lado de la frontera
    main_hub: madrid
    focus_regions: ["madrid", "aragon"]
    bboxes:
      peninsula_baleares: [-9.6, 35.8, 4.6, 43.9]
      canarias: [-18.3, 27.5, -13.3, 29.5]
  JPN:
    name: Japan
    iso2: JP
    crs_equal_area: "+proj=laea +lat_0=36 +lon_0=137 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs"
    climate: nasapower               # NASA POWER (MERRA-2 0,5°, global, sin clave)
    neighbours_iso2: [JP]
    main_hub: tokyo
    focus_regions: ["tokyo", "osaka"]
    skip_collectors: [osm]           # Overpass es lento: se lanza aparte con --only osm
    bboxes:
      japon: [122.9, 24.0, 146.0, 45.6]
  USA:
    name: United States
    firms_name: United_States
    iso2: US
    crs_equal_area: "EPSG:5070"      # NAD83 / Conus Albers
    climate: gridmet                 # gridMET 4 km (EEUU continental, sin clave)
    adm1_exclude: [alaska, hawaii, puerto rico, guam, virgin islands, american samoa, northern mariana]
    neighbours_iso2: [US, CA, MX]
    main_hub: ashburn
    focus_regions: ["=virginia", "texas", "arizona"]
    skip_collectors: [osm]           # Overpass no puede con EEUU entero
    bboxes:
      conus: [-124.9, 24.4, -66.9, 49.5]

hubs:                               # para distancias y latencias
  madrid: [-3.70, 40.42]
  frankfurt: [8.68, 50.11]
  ashburn: [-77.49, 39.04]
  singapore: [103.82, 1.35]
  tokyo: [139.69, 35.69]
latency:
  route_factor: 1.4                 # la fibra no va en línea recta
  ms_per_km_rtt: 0.01               # ~5 µs/km por sentido
  fixed_ms: 1.0

climate:
  free_cooling_threshold_c: 18
  adiabatic_wetbulb_threshold_c: 21
  heatwave_threshold_c: 35
  tropical_night_c: 20
  extreme_cold_c: -15
  # Modelo simplificado (supuesto, documentado en field_lineage)
  pue_base: 1.08
  pue_mech_penalty: 0.32            # PUE = base + penalty * (1 - horas_free_cooling/8760)
  wue_base_l_kwh: 0.2
  wue_cdd_coef: 0.0012              # WUE = base + coef * CDD anual

earthquakes:
  daily_catalog_client: EMSC        # catálogo diario (magnitudes pequeñas)
  daily_min_magnitude: 1.5
  daily_radius_km: 100
  static_client: USGS               # estadísticas históricas M>=4 desde 1976
  static_start: "1976-01-01"

fires:
  sources: [MODIS_SP]               # serie homogénea desde 2000; añadir VIIRS_SNPP_SP si se quiere
  radius_km: 10

seismic:
  networks_clients: ["eida-routing", "IRIS"]
  channels: "HH?,BH?,HN?"
  max_station_km: 100
  days_per_year: 4                  # días muestreados por año y estación
  windows_utc: ["01:00", "11:00"]   # noche y día (inicio)
  window_minutes: 60
  hv_window_s: 60
  hv_fmin: 0.2
  hv_fmax: 20
  konno_ohmachi_b: 40
  keep_raw_waveforms: false         # borra el MiniSEED tras calcular las features

electricity:
  island_admin1: ["canarias", "baleares", "illes balears", "islas baleares"]  # sin precio OMIE ni REE peninsular
  # factores de emisión aproximados (tCO2/MWh), supuesto documentado
  emission_factors:
    "Carbón": 0.95
    "Ciclo combinado": 0.37
    "Cogeneración": 0.38
    "Fuel + Gas": 0.70
    "Motores diésel": 0.77
    "Turbina de gas": 0.60
    "Turbina de vapor": 0.75
    "Residuos no renovables": 0.24
  renewable_titles: ["Hidráulica", "Eólica", "Solar fotovoltaica", "Solar térmica", "Otras renovables", "Residuos renovables", "Hidroeólica"]
  omie_es_field_index: 5            # columna del precio de España en marginalpdbc (VERIFICAR con un archivo real)

overpass_endpoints:
  - "https://overpass-api.de/api/interpreter"
  - "https://overpass.kumi.systems/api/interpreter"

# Rásteres remotos que se leen sin descargarlos enteros (COG/VRT por HTTP)
remote_rasters:
  - {field: clay_pct, url: "https://files.isric.org/soilgrids/latest/data/clay/clay_0-5cm_mean.vrt", scale: 0.1, source: "SoilGrids (ISRIC)", license: "CC BY 4.0"}
  - {field: sand_pct, url: "https://files.isric.org/soilgrids/latest/data/sand/sand_0-5cm_mean.vrt", scale: 0.1, source: "SoilGrids (ISRIC)", license: "CC BY 4.0"}
  - {field: bulk_density, url: "https://files.isric.org/soilgrids/latest/data/bdod/bdod_0-5cm_mean.vrt", scale: 0.01, source: "SoilGrids (ISRIC)", license: "CC BY 4.0"}
  - {field: soil_type_wrb, url: "https://files.isric.org/soilgrids/latest/data/wrb/MostProbable.vrt", scale: 1, categorical: true, source: "SoilGrids (ISRIC)", license: "CC BY 4.0"}

# Capas que hay que descargar a mano (registro o formulario) y dejar en data_lake/raw/manual/
# Si el archivo no está, se omite con un aviso. Comprobad los nombres de atributos al descargarlas.
manual_layers:
  - name: wdpa
    file: "wdpa/WDPA_ESP.gpkg"
    download: "https://www.protectedplanet.net/country/ESP"
    license: "Términos de uso WDPA (no comercial)"
    kind: vector
    ops:
      - {op: distance_km, field: dist_protected_area_km}
      - {op: contains, field: in_protected_area}
      - {op: nearest_attr, field: protected_area_iucn_cat, attr: IUCN_CAT}
  - name: natura2000
    file: "natura2000/Natura2000_ES.gpkg"
    download: "https://www.eea.europa.eu/en/datahub (Natura 2000 End 2023)"
    license: "EEA standard re-use policy"
    kind: vector
    ops:
      - {op: distance_km, field: dist_natura2000_km}
  - name: ramsar
    file: "ramsar/ramsar_sites.gpkg"
    download: "https://rsis.ramsar.org"
    kind: vector
    ops: [{op: distance_km, field: dist_ramsar_km}]
  - name: gem_hazard
    file: "gem/v2023_1_pga_475_rock_3min.tif"
    download: "https://www.globalquakemodel.org/product/global-seismic-hazard-map (licencia CC BY-NC-SA)"
    license: "CC BY-NC-SA 4.0"
    kind: raster
    ops: [{op: sample, field: pga_475y_g}]
  - name: gem_faults
    file: "gem/gem_active_faults_harmonized.geojson"
    download: "https://github.com/GEMScienceTools/gem-global-active-faults"
    license: "CC BY-SA 4.0"
    kind: vector
    ops:
      - {op: distance_km, field: dist_active_fault_km}
      - {op: nearest_attr, field: fault_slip_rate_mm_yr, attr: net_slip_rate}
  - name: usgs_vs30
    file: "vs30/global_vs30.tif"
    download: "https://earthquake.usgs.gov/data/vs30/"
    license: "Dominio público (USGS)"
    kind: raster
    ops: [{op: sample, field: vs30_ms}]
  - name: aqueduct
    file: "aqueduct/Aqueduct40_baseline_annual.gpkg"
    download: "https://www.wri.org/data/aqueduct-global-maps-40-data"
    license: "CC BY 4.0"
    kind: vector
    ops:
      - {op: point_attr, field: water_stress, attr: bws_score}
      - {op: point_attr, field: water_depletion, attr: bwd_score}
      - {op: point_attr, field: interannual_variability, attr: iav_score}
      - {op: point_attr, field: seasonal_variability, attr: sev_score}
      - {op: point_attr, field: groundwater_decline, attr: gtd_score}
      - {op: point_attr, field: drought_risk, attr: drr_score}
  - name: hydrorivers
    file: "hydrosheds/HydroRIVERS_v10_eu.gpkg"
    download: "https://www.hydrosheds.org/products/hydrorivers"
    license: "HydroSHEDS license (atribución)"
    kind: vector
    ops:
      - {op: distance_km, field: dist_river_km}
      - {op: nearest_attr, field: river_order, attr: ORD_STRA}
      - {op: nearest_attr, field: nearest_river_discharge_m3s, attr: DIS_AV_CMS}
  - name: hydrowaste
    file: "hydrowaste/HydroWASTE_v10.gpkg"
    download: "https://www.hydrosheds.org/products/hydrowaste"
    kind: vector
    ops:
      - {op: distance_km, field: dist_wwtp_km}
      - {op: nearest_attr, field: wwtp_capacity_pe, attr: POP_SERVED}
  - name: grand_dams
    file: "grand/GRanD_reservoirs_v1_3.gpkg"
    download: "https://www.globaldamwatch.org/grand"
    kind: vector
    ops: [{op: distance_km, field: dist_reservoir_km}]
  - name: snczi_t100
    file: "snczi/ZI_T100.gpkg"
    download: "https://www.miteco.gob.es/es/cartografia-y-sig/ide/descargas/agua/zi-lamina.html"
    license: "CC BY 4.0 (MITECO)"
    kind: vector
    ops: [{op: contains, field: in_official_flood_zone}]
  - name: jrc_flood_rp100
    file: "jrc_flood/floodMap_RP100_europe.tif"
    download: "https://data.jrc.ec.europa.eu/collection/id-0054"
    kind: raster
    ops: [{op: sample, field: flood_depth_rp100_m, nodata_as: 0}]
  - name: ghsl_pop
    file: "ghsl/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0.tif"
    download: "https://human-settlement.emergency.copernicus.eu/download.php?ds=pop"
    license: "CC BY 4.0"
    kind: raster
    ops:
      - {op: zonal_sum_km, field: population_1km, radius_km: 1}
      - {op: zonal_sum_km, field: population_10km, radius_km: 10}
      - {op: zonal_sum_km, field: population_50km, radius_km: 50}
  - name: worldcover
    file: "worldcover/ESA_WorldCover_ES.tif"
    download: "https://esa-worldcover.org/en/data-access"
    license: "CC BY 4.0"
    kind: raster
    ops: [{op: sample, field: land_cover_class}]
  - name: koppen
    file: "koppen/koppen_geiger_0p00833333.tif"
    download: "https://www.gloh2o.org/koppen/"
    license: "CC BY 4.0"
    kind: raster
    ops: [{op: sample, field: koppen_class}]
  - name: lightning
    file: "lightning/LISOTD_HRFC_V2.3.2015.tif"
    download: "https://ghrc.nsstc.nasa.gov/ (LIS/OTD climatology, convertir a GeoTIFF)"
    kind: raster
    ops: [{op: sample, field: lightning_density}]
  - name: wokam
    file: "wokam/wokam_carbonate_rocks.gpkg"
    download: "https://www.whymap.org (WOKAM)"
    kind: vector
    ops: [{op: contains, field: karst_flag}]
