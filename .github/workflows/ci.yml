# Quality checks on every push and pull request: PEP 8 format and lint (ruff) and the offline tests.
# Only the code is checked out (sparse checkout): the datasets are not needed and are large.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            ETL/dclake
            ETL/tests
            ETL/data_dictionary/build_dict.py
            ETL/conftest.py
            Modelo/src
            Modelo/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            ETL/dclake
            ETL/tests
            ETL/data_dictionary
            ETL/conftest.py
            ETL/config.yaml
            ETL/requirements.txt
            Modelo/src
            Modelo/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ETL/requirements.txt
      - run: pip install -r ETL/requirements.txt
      - run: python -m pytest -q
