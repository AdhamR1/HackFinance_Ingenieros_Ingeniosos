# Quality checks on every push and pull request: PEP 8 format and lint (ruff) and the offline tests.
# Only the code is checked out (sparse checkout): the datasets are not needed and are large.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            ELT/dclake
            ELT/tests
            ELT/data_dictionary/build_dict.py
            ELT/conftest.py
            pipeline/src
            pipeline/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            ELT/dclake
            ELT/tests
            ELT/data_dictionary
            ELT/conftest.py
            ELT/config.yaml
            ELT/requirements.txt
            pipeline/src
            pipeline/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ELT/requirements.txt
      - run: pip install -r ELT/requirements.txt
      - run: python -m pytest -q
