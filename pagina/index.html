<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Can I Build Here?</title>
  <meta name="description" content="Can I Build Here? — Viabilidad de terrenos para data centers.">
  <meta name="theme-color" content="#0a0b0d">

  <!-- Fuentes: Inter (textos) y JetBrains Mono (IDs y nombres técnicos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

  <!-- MapLibre GL JS (librería del mapa), versión fija -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="mapa" class="mapa"></div>

  <!-- Barra superior flotante -->
  <header class="barra-superior">
    <div class="marca">
      <span class="marca-nombre">Can I Build Here?</span>
      <span class="marca-sub" data-i18n="subtitulo"></span>
    </div>

    <div class="buscador" role="search">
      <svg class="buscador-lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="buscador-input" type="search" autocomplete="off" spellcheck="false"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="buscador-lista"
             data-i18n-placeholder="buscar_placeholder" data-i18n-aria="buscar_aria">
      <ul id="buscador-lista" class="buscador-lista" role="listbox" hidden></ul>
    </div>

    <div class="controles-superiores">
      <button id="boton-mundo" class="boton boton-secundario" hidden>
        <span aria-hidden="true">←</span> <span data-i18n="volver_mundo"></span>
      </button>
      <select id="selector-pais" class="selector" data-i18n-aria="elige_pais"></select>
    </div>
  </header>

  <!-- Etiqueta de datos de prueba (se quita en config.js) -->
  <div id="etiqueta-prueba" class="etiqueta-prueba" hidden data-i18n-title="datos_prueba_ayuda">
    <span data-i18n="datos_prueba"></span>
  </div>

  <!-- Tarjeta de controles: capa base, opacidad y leyenda -->
  <section id="controles-mapa" class="tarjeta-controles" data-i18n-aria="controles_mapa">
    <button id="boton-plegar" class="boton-plegar" aria-expanded="true" aria-controls="controles-cuerpo">
      <span data-i18n="leyenda"></span><span class="flecha" aria-hidden="true">▾</span>
    </button>
    <div id="controles-cuerpo" class="controles-cuerpo">
      <div class="segmentado" role="group" data-i18n-aria="capa_base">
        <button id="capa-satelite" type="button" data-capa="satelite" data-i18n="capa_satelite"></button>
        <button id="capa-mapa" type="button" data-capa="mapa" data-i18n="capa_mapa"></button>
      </div>

      <div id="bloque-cuadricula" hidden>
        <label class="control-opacidad">
          <span class="control-titulo"><span data-i18n="opacidad"></span> <output id="opacidad-valor" class="mono"></output></span>
          <input id="opacidad" type="range" min="0" max="100" step="5">
        </label>
        <ul id="leyenda" class="leyenda"></ul>
      </div>
    </div>
  </section>

  <!-- Panel lateral con los datos del cuadrado (en móvil sale desde abajo) -->
  <aside id="panel" class="panel" hidden aria-labelledby="panel-id">
    <button id="panel-cerrar" class="panel-cerrar" data-i18n-aria="cerrar" data-i18n-title="cerrar">✕</button>
    <div id="panel-contenido"></div>
  </aside>

  <!-- Tooltip que sigue al ratón -->
  <div id="tooltip" class="tooltip" hidden></div>

  <!-- Avisos breves (p. ej. errores de carga) -->
  <div id="aviso" class="aviso" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
